<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">
  <title>Bingo Card Generator | Kids Classroom Games</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../../images/home/kcgfavicon.png">
</head>

<body>
   <header>
        <h1>BINGO</h1>
        <p>Select which category you like
        <br> choose the number of items.
        </p>
   </header>

   <div class="controls">

        <div>
          <label>Bingo Title:</label>
          <input
              type="text"
              id="bingoTitle"
              placeholder="e.g. Fruit Bingo"
          >
        </div>
    
        <div>

            <label for="categorySelect">Choose Categories:</label>
              <select id="categorySelect"></select>

        </div>

        <div>

            <h3>Filter by tags.</h3>
            <div id="tagsContainer"></div>

        </div>
        <!--
        <div>
            <label>Upload Images</label>
            <input type="file" 
                id="image-upload"
                accept="image/*"
                multiple
            >
        </div> 
        -->
        <div>
            <label>Language:</label>
            <select id="languageSelect"></select>
        </div>

        <div>

            <label for="gridSize">Bingo Grid</label>
            <select id="gridSize">
              <option value="3x3">3 x 3</option>
              <option value="4x4">4 x 4</option>
            </select>
        </div>

        <div>

            <label>Cards to generate:</label>
            <select id="cardCount"></select>

        </div>

        <div>
            <label>PDF Layout:</label>
            <select id="pdfLayout">
                <option value="1">
                    1 Card per sheet
                </option>
                <option value="2">
                    2 Cards per sheet
                </option>
            </select>
        </div>

        <fieldset id="itemSelectionModeControl">
            <legend>
                Choose Bingo Items
            </legend>

            <label class="item-mode-option">
                <input
                    type="radio"
                    name="bingoItemMode"
                    value="all"
                    checked
                >
                <span>
                    Use All Matching Items
                </span>
            </label>

            <label class="item-mode-option">
                <input
                    type="radio"
                    name="bingoItemMode"
                    value="specific"
                >
                <span>
                    Choose Specific Items
                </span>
            </label>

            <p class="item-mode-note">
                Choose a category and tags, then select which items can appear on the cards.
            </p>
        </fieldset>

  </div>

  <div id="selectedItemsContainer">

      <h3>
          Selected Items
          (<span id="selectedItemsCount">0</span>)
      </h3>

      <div id="selectedItemsList">
      </div>

  </div>

   <div class="btn-container">
        <button id="generateBtn">GENERATE BINGO</button>
        <button id="resetBtn">RESET</button>
   </div>

   


   
    
   <div id="generatedCardsContainer">

        <h3
            id="generatedCardsHeading"
            class="hidden"
        >  
            Generated Cards
        </h3>
       <button
      id="downloadPdfBtn"
      class="hidden"
      >
      DOWNLOAD PDF
      </button>
      <div id="bingoCards"></div>

   </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../js/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/database.js"></script>

    <script src="../../js/gameUtils.js"></script>
    <script src="../../js/filters.js"></script>
    <script src="../../js/preview.js"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

   <script src="bingo.js"></script>

</body>
</html>
