<body>
<div>

                <option value="select">select</option>

            </select>
        </div>
        <p>Create your own questions</p>
        <button id="create-btn">Create Board</button>    
    </div>
</div>


<form id="user-inputs" class="hidden">
    <h2>Input the contents here:</h2>
   
    <div id="column-container">

        
    </div>

    <button id="submit" type="submit">Submit</button> 
</form>

<button id="start-btn">
Start Game
</button>

    <div id="board"></div>

</div>
