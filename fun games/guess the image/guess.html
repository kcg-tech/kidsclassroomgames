<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta
    name="description"
    content="Play Guess the Image, an interactive classroom vocabulary game with customizable categories, languages, tags, and image reveal modes."
    >
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
        >
    <title>Guess the Image Classroom Vocabulary Game | Kids Classroom Games</title>
    <link
        rel="canonical"
        href="https://www.kidsclassroomgames.com/fun%20games/guess%20the%20image/guess.html"
    >
    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="../../gameNavigation.css"
    >
    <link rel="icon" type="image/png" href="../../images/home/kcgfavicon.png">

</head>

<body>

    <div id="setup-page">

        <header>
                <h1>Guess the images</h1>
                <p>Select which category you like
                <br> choose the number of items.
                </p>
        </header>

        <div class="controls">
            
                <div>
                    <label>Choose Categories:</label>
                    <select id="presetSelect"></select>
                </div>
                
                <div>
                    <h3>Filter by tags.</h3>
                    <div id="tagsContainer"></div>
                </div>
        
                <div>
                    <label>Language:</label>
                    <select id="languageSelect"></select>
                </div>


                <fieldset id="item-selection-mode-control">
                    <legend>
                        Choose Game Items
                    </legend>

                    <label>
                        <input
                            type="radio"
                            name="itemSelectionMode"
                            value="specific"
                        >
                        Choose Specific Items
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="itemSelectionMode"
                            value="random"
                            checked
                        >
                        Random Items
                    </label>
        
                    <div id="random-item-count-control">
                        <label for="item-count">
                            Number of Items:
                        </label>

                        <select id="item-count"></select>
                    </div>

                </fieldset>

               

        </div>

        <div id="selectedItemsContainer">

            <h3>
                <span id="item-list-heading">
                    Available Items
                </span>

                (<span id="selectedItemsCount">0</span>)
            </h3>
            <div
                id="specific-selection-controls"
                class="hidden"
            >
                <p>
                    Click the items you want to include.
                    Choose at least three.
                </p>

                <div class="specific-selection-buttons">
                    <button
                        type="button"
                        id="select-all-items-btn"
                    >
                        Select All
                    </button>

                    <button
                        type="button"
                        id="clear-selected-items-btn"
                    >
                        Clear Selection
                    </button>
                </div>
            </div>
            <div id="selectedItemsList"></div>

        </div>

        <div class="btn-container">

            <button
                type="button"
                id="start-btn"
            >
                OPEN GAME
            </button>

        </div>

    </div>

    <div id="game-area" class="hidden">

        <div class="mode-buttons">
            <h3>Select image reveal mode:</h3>
            <button id="auto-btn">Auto Reveal</button>
            <button
                type="button"
                id="manual-btn"
                class="selected"
            >
                Manual Reveal
            </button>
        </div>

        <div class="play-controls">
            <button
                type="button"
                id="start-play-btn"
            >
                START GAME
            </button>

            <button
                type="button"
                id="close-game-btn"
            >
                CLOSE GAME
            </button>
        </div>

        <div id="image-wrapper">

            <img id="quiz-image">
            <div id="cover-grid"></div>

        </div>   

        <div id="answer-buttons">
            <button class="answer-btn"></button>
            <button class="answer-btn"></button>
            <button class="answer-btn"></button>
        </div>

        <p id="score-display">
        Score: 0
        </p>

    </div>
   

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../../js/config.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../js/supabase.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/database.js"></script>

    <script src="../../js/gameUtils.js"></script>
    <script src="../../js/filters.js"></script>
    <script src="../../js/preview.js"></script>

    <script src="../../js/gameNavigation.js"></script>
    <script src="script.js"></script>

</body>
</html>
